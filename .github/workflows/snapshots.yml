name: Odds snapshots
# Takes the odds snapshots without a Claude session (no model usage, so no usage limits).
# Target slots, Eastern: 8:13, 11:13 (before the noon lock), 18:13, 21:13 on Thu-Sun.
# GitHub cron is UTC-only, so each slot is listed for both EDT (UTC-4) and EST (UTC-5);
# the extra capture each run is harmless (every snapshot is a distinct, timestamped file).
on:
  schedule:
    - cron: "13 12,13,15,16,22,23 * * 4,5,6,0"   # 8:13/11:13/18:13 ET, Thu-Sun
    - cron: "13 1,2 * * 5,6,0,1"                 # 21:13 ET Thu-Sun = early UTC next day
  workflow_dispatch: {}
  push:                                          # run once when this workflow itself changes
    branches: [main]
    paths: [".github/workflows/snapshots.yml"]
permissions:
  contents: write
concurrency:
  group: odds-snapshots
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take snapshot
        run: python snapshots.py take
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/snapshots
          if git diff --cached --quiet; then
            echo "nothing captured"; exit 1
          fi
          git commit -q -m "Odds snapshot $(date -u +%Y-%m-%dT%H:%MZ) (GitHub Actions)"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1
